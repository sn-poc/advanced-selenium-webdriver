[project]
name = "playwright-tests"
version = "1.0.0"
description = "Playwright test suite migrated from Selenium WebDriver"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40.0",
    "pytest>=7.4.0",
    "pytest-playwright>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
